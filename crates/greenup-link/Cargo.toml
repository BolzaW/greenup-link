[package]
name = "greenup-link"
version.workspace = true
edition = "2021"

[dependencies]
serialport = { version = "4.10.1", default-features = false }
tokio = { version = "1.37.0", features = ["full"] }
axum = "0.7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
greenup-protocol = { path = "../greenup-protocol" }
greenup-driver = { path = "../greenup-driver" }

