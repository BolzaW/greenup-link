[package]
name = "greenup-driver"
version.workspace = true
edition = "2024"

[dependencies]
chrono = "0.4.45"
greenup-protocol = { path = "../greenup-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serialport = { version = "4.10.1", default-features = false }
tokio = { version = "1.53.2", features = ["full"] }
