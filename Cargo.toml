[package]
name = "greenup-link"
version = "0.0.1"
edition = "2021"

[dependencies]
serialport = { version = "4.10.1", default-features = false }
tokio = { version = "1.37.0", features = ["full"] }
axum = { version = "0.7.5", features = ["multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

