chargers:
  - name: greenup
    type: custom
    status:
      source: http
      uri: http://localhost:3000/api/telemetry
      jq: .iec_state
      timeout: 5s
      
    power:
      source: http
      uri: http://localhost:3000/api/telemetry
      jq: .power
      timeout: 5s
      
    energy:
      source: http
      uri: http://localhost:3000/api/telemetry
      jq: .energy
      timeout: 5s
      
    enabled:
      source: http
      uri: http://localhost:3000/api/telemetry
      jq: .charge_authorized
      timeout: 5s
      
    enable:
      source: script
      cmd: /bin/sh -c "if [ '${enable}' = 'true' ]; then curl -s -X POST -H 'Content-Type: application/json' -d '{\"action\":\"enable\"}' http://localhost:3000/api/charge; else curl -s -X POST -H 'Content-Type: application/json' -d '{\"action\":\"disable\"}' http://localhost:3000/api/charge; fi"
      
    maxcurrent:
      source: script
      cmd: curl -s -X POST http://localhost:3000/api/current/${maxcurrent}

loadpoints:
  - title: Garage
    charger: greenup
    mode: pv
    mincurrent: 7
    maxcurrent: 32

site:
  title: Maison
  meters:
    grid: my_grid_meter
